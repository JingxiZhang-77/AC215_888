# GitHub Actions CI/CD Pipeline for Safety Event Classification API
# Runs on every push and pull request to main/develop branches
# All tests run inside Docker container for consistency
# Following cheese-app-ci-cd reference pattern

name: CI Pipeline

on:
  push:
    branches: [main, develop, Milestone5]
  pull_request:
    branches: [main, develop, Milestone5]

env:
  DOCKER_IMAGE_NAME: safety-event-api

jobs:
  # Job 1: Build Docker image with tests included (shared across all jobs)
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (with tests)
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} -f Dockerfile.test .

      - name: Save Docker image
        run: |
          docker save ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} -o /tmp/safety-event-api.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/safety-event-api.tar
          retention-days: 1

  # Job 2: Run linting and formatting checks
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/safety-event-api.tar

      - name: Run Black formatter check
        run: |
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} black --check --line-length 120 . --exclude='\.venv|__pycache__|model|_archive'
        continue-on-error: false

      - name: Run Flake8 linter
        run: |
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} flake8 --max-line-length=120 --extend-ignore=E203,W503,E501 . --exclude=.venv,__pycache__,model,_archive
        continue-on-error: true

  # Job 3: Run unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/safety-event-api.tar

      - name: Run unit tests
        run: |
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} pytest tests/unit/ -v --tb=short

      - name: Generate coverage report
        run: |
          docker run --rm -v ${{ github.workspace }}/coverage:/app/coverage ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} pytest tests/unit/ --cov=utils --cov=routers --cov-report=term --cov-report=xml:coverage/coverage.xml --cov-fail-under=50
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-unit
          path: coverage/
        if: always()
        continue-on-error: true

  # Job 4: Run integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/safety-event-api.tar

      - name: Run integration tests
        run: |
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} pytest tests/integration/ -v --tb=short

  # Job 5: Run system tests (E2E)
  system-tests:
    name: System Tests (E2E)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/safety-event-api.tar

      - name: Create secrets directory with mock credentials
        run: |
          mkdir -p /tmp/secrets
          cat > /tmp/secrets/llm-service-account.json << 'EOF'
          {
            "type": "service_account",
            "project_id": "mock-test-project",
            "private_key_id": "mock-key-id",
            "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC\n-----END PRIVATE KEY-----\n",
            "client_email": "test@mock-project.iam.gserviceaccount.com",
            "client_id": "123456789",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/test%40mock-project.iam.gserviceaccount.com"
          }
          EOF

      - name: Start API server container
        run: |
          docker run -d \
            --name api-server \
            -p 9000:9000 \
            -v /tmp/secrets:/secrets:ro \
            -e GOOGLE_APPLICATION_CREDENTIALS=/secrets/llm-service-account.json \
            -e GCP_PROJECT=mock-test-project \
            -e GCP_REGION=us-central1 \
            -e ENVIRONMENT=test \
            -e DEV=1 \
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            uvicorn service:app --host 0.0.0.0 --port 9000

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:9000/api/v1/health 2>/dev/null; then
              echo "✅ Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "❌ Server failed to start"
          docker logs api-server
          exit 1

      - name: Run system tests
        run: |
          docker run --rm --network host ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} pytest tests/system/ -v --tb=short

      - name: Show server logs
        if: always()
        run: |
          docker logs api-server

      - name: Stop server container
        if: always()
        run: |
          docker stop api-server || true
          docker rm api-server || true

  # Job 6: Combined coverage report
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/safety-event-api.tar

      - name: Generate combined coverage report
        run: |
          mkdir -p coverage-html
          docker run --rm -v ${{ github.workspace }}/coverage-html:/app/htmlcov ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} pytest tests/unit/ tests/integration/ \
            --cov=utils --cov=routers --cov=services --cov=models \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=50
        continue-on-error: true

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: coverage-html/
        if: always()
        continue-on-error: true

  # Job 7: Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, system-tests, coverage-report]
    if: always()
    steps:
      - name: Check test results
        id: test-results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| System Tests | ${{ needs.system-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Report | ${{ needs.coverage-report.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.system-tests.result }}" != "success" ]; then
            echo "❌ Some tests failed!" >> $GITHUB_STEP_SUMMARY
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Fail if tests failed
        if: steps.test-results.outputs.status == 'failure'
        run: |
          echo "Tests failed - see summary above"
          exit 1
