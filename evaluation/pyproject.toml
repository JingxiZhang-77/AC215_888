[project]
name = "safety-event-evaluation"
version = "1.0.0"
description = "Evaluation pipeline for Safety Event Classification model"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Core dependencies from API
    "chromadb>=0.4.0",
    "google-genai>=1.50.1",
    "pandas>=2.3.3",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    
    # Excel file support
    "openpyxl>=3.1.5",
    
    # Evaluation-specific dependencies
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
]

[tool.uv]
dev-dependencies = []
