[project]
name = "safety-event-api"
version = "1.0.0"
description = "Safety Event Classification REST API"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.121.2",
    "google-cloud-speech>=2.34.0",
    "google-cloud-translate>=3.23.0",
    "google-genai>=1.50.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "passlib>=1.7.4",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pydub>=0.25.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "httpx>=0.26.0",
]
