[project]
name = "safety-event-api"
version = "1.0.0"
description = "Safety Event Classification REST API"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "google-genai>=1.0.0",
    "google-cloud-speech>=2.24.0",
    "google-cloud-translate>=3.14.0",
    "pandas>=2.1.4",
    "openpyxl>=3.1.2",
    "pydub>=0.25.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "httpx>=0.26.0",
]
