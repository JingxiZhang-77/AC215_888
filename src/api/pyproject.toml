[project]
name = "safety-event-api"
version = "1.0.0"
description = "Safety Event Classification REST API"
requires-python = ">=3.11,<3.12"

dependencies = [
    "bcrypt>=4.0.0,<5.0.0",
    "chromadb>=0.4.0",
    "fastapi>=0.121.2",
    "google-cloud-speech>=2.34.0",
    "google-cloud-translate>=3.23.0",
    "google-genai>=1.50.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pydub>=0.25.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
    # Testing dependencies (included for Docker-based testing)
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    # Linting/formatting tools
    "flake8>=7.0.0",
    "black>=24.1.1",
]

[tool.uv]
dev-dependencies = [
    # Dev dependencies kept for local development convenience
]
