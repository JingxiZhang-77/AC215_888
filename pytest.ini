# Root Pytest Configuration for Safety Event Classification Project
# This file allows running tests from the project root

[pytest]
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add options for verbose output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers for different test types
markers =
    unit: Unit tests (run quickly, no external dependencies)
    integration: Integration tests (require FastAPI TestClient)
    system: System tests (require running API server at localhost:9000)
    slow: Tests that take significant time to run
