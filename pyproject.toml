[project]
name = "medical-severity-classification"
version = "0.1.0"
description = "LLM-based classification of hospital safety incidents."
authors = [
    { name = "Zilong Wang", email = "zilongwang@hsph.harvard.edu" },
    { name = "Alice Zhang", email = "yue_zhang@hsph.harvard.edu" },
    { name = "Bruce Zhou", email = "huiyuan_zhou@hsph.harvard.edu" },
    { name = "Jingxi Zhang", email = "jingxizhang@hsph.harvard.edu" }
]
requires-python = ">=3.11,<3.13"

# === Core dependencies ===
dependencies = [
    # --- Data processing ---
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "tqdm",

    # --- Machine Learning / Analytics ---
    "scikit-learn>=1.3.0",

    # --- File and PDF handling ---
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",   # provides fitz
    "semantic-chunker==0.2.0",  # stable version
    "semantic-splitter>=0.2.1", # for SemanticChunker
    "requests",

    # --- Google / Vertex AI ---
    "google-generativeai>=0.8.2",
    "google-cloud-aiplatform>=1.63.0",
    "google-cloud-storage>=2.17.0",

    # --- General-purpose utilities ---
    "argparse",
    "shutilwhich",  # safer for shutil usage
    "glob2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipython",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

